function giftScene(){show(`<div class="gs"><img src="${IMG.giftin}" alt="Open gift box with a card and bouquet"><button class="lt" id="lt" aria-label="Read the letter"></button></div>`,CFG.giftCaption,{label:"Back to the cake",go:scenes.cake});$('lt').onclick=openLetter}
function openLetter(){$('lov').classList.add('on');$('lscroll').scrollTop=0;$('lclose').focus()}
function closeLetter(){$('lov').classList.remove('on')}
$('lclose').onclick=closeLetter;$('lscroll').onclick=e=>{if(e.target===$('lscroll'))closeLetter()};

let camStream=null,boothRun=0;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function stopCam(){boothRun++;if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}}
function boothScene(){bgm.play('booth');show(`<div class="gs"><img src="${IMG.boothin}" alt="Inside the photo booth"><button class="bh" id="bh" aria-label="Open the camera"></button></div>`,CFG.boothCaption);
  $('bh').onclick=()=>{$('body').innerHTML='<div class="pb" id="pb"></div>';$('cap').textContent='';const o=$('ov');o.style.setProperty('--bgimg',`url(${IMG.boothin})`);o.classList.add('bbg','soft','menu');pbCount()}}
function pbRender(h){stopCam();$('pb').innerHTML=h}
function pbCount(){pbRender(`<h2>Photo booth \u{1F4F8}</h2><p class="pbp">How many photos would you like?</p><div class="pbrow"><button class="btn" data-n="3">3 photos</button><button class="btn" data-n="4">4 photos</button></div><button class="btn alt" id="pb-x">Back to the party</button>`);
  $('pb').querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>pbCam(+b.dataset.n));$('pb-x').onclick=closeOv}
async function pbCam(n){
  pbRender(`<div class="cam" style="--ar:1.333"><video id="vid" autoplay playsinline muted></video><div id="cd"></div><div id="fl"></div></div><div class="shots" id="shots">${'<i></i>'.repeat(n)}</div><div class="pbrow"><button class="btn" id="snap" disabled>Starting camera\u2026</button><button class="btn alt" id="pb-b">\u2190 Back</button></div><p class="pbp" id="pbmsg"></p>`);
  const run=boothRun;$('pb-b').onclick=pbCount;
  let live=false;
  try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:960}},audio:false});
    if(run!==boothRun){camStream&&camStream.getTracks().forEach(t=>t.stop());camStream=null;return}
    const v=$('vid');v.srcObject=camStream;await v.play().catch(()=>{});live=true}catch(e){}
  if(run!==boothRun)return;
  const shots=[],snap=$('snap');
  const mark=(k,c)=>{const el=$('shots')&&$('shots').children[k];if(el){el.classList.add('on');el.style.backgroundImage=`url(${c.toDataURL('image/jpeg',.4)})`}};
  const done=()=>{if(run===boothRun)pbLayout(n,shots)};
  snap.disabled=false;
  if(live){
    snap.textContent="Start \u{1F4F8}";$('pbmsg').textContent="Strike a pose. A countdown runs before every photo.";
    snap.onclick=async()=>{snap.disabled=true;
      for(let k=0;k<n;k++){
        for(let s=k?2:3;s>0;s--){if(run!==boothRun)return;$('cd').textContent=s;await wait(850)}
        if(run!==boothRun)return;$('cd').textContent='';
        const c=grab($('vid'));shots.push(c);mark(k,c);$('fl').classList.add('on');setTimeout(()=>$('fl')&&$('fl').classList.remove('on'),120);
        await wait(900)}
      done()}
  }else{
    const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.setAttribute('capture','user');
    snap.textContent=`Take photo 1 of ${n}`;$('pbmsg').textContent="The camera isn't available here, so each photo opens your camera app instead.";
    inp.onchange=async()=>{const file=inp.files&&inp.files[0];if(!file)return;
      const bm=await createImageBitmap(file),s=Math.min(1,1280/bm.width),c=document.createElement('canvas');c.width=bm.width*s;c.height=bm.height*s;c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
      shots.push(c);mark(shots.length-1,c);
      if(shots.length>=n)done();else snap.textContent=`Take photo ${shots.length+1} of ${n}`};
    snap.onclick=()=>{inp.value='';inp.click()}}
}
async function pbLayout(n,shots){
  pbRender(`<h2>Pick your layout</h2><p class="pbp">Tap the strip you like best.</p><div class="pbrow pbfr" id="pbl"><p class="pbp">Making your strips\u2026</p></div><div class="pbrow"><button class="btn alt" id="pb-r">Retake photos</button><button class="btn alt" id="pb-b">\u2190 Back</button></div>`);
  const run=boothRun;$('pb-r').onclick=()=>pbCam(n);$('pb-b').onclick=pbCount;
  const cs=await Promise.all(FRAMES[n].map(f=>compose(f,shots)));
  if(run!==boothRun)return;
  const row=$('pbl');row.innerHTML='';
  cs.forEach((c,i)=>{const b=document.createElement('button');b.className='pbf';b.setAttribute('aria-label','Layout '+(i+1));b.appendChild(c);b.onclick=()=>pbResult(n,shots,c);row.appendChild(b)})}
function grab(v){const s=Math.min(1,1280/v.videoWidth),c=document.createElement('canvas');c.width=v.videoWidth*s;c.height=v.videoHeight*s;
  const x=c.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(v,0,0,c.width,c.height);return c}
async function compose(f,shots){
  const c=document.createElement('canvas');c.width=f.w;c.height=f.h;const x=c.getContext('2d');
  f.slots.forEach((s,i)=>{const im=shots[i];if(!im)return;const [sx,sy,sw,sh]=s,ar=sw/sh,iw=im.width,ih=im.height;let cw=iw,ch=iw/ar;if(ch>ih){ch=ih;cw=ih*ar}
    x.drawImage(im,(iw-cw)/2,(ih-ch)/2,cw,ch,sx-4,sy-4,sw+8,sh+8)});
  await new Promise(r=>{const im=new Image();im.onload=()=>{x.drawImage(im,0,0,c.width,c.height);r()};im.onerror=r;im.src=f.src});
  return c}
function pbResult(n,shots,c){
  pbRender(`<h2>Ta-da! \u{1F389}</h2><img class="strip" src="${c.toDataURL('image/png')}" alt="Your photo strip"><p class="pbp">Tap Save, or press and hold the picture.</p><div class="pbrow"><button class="btn" id="pb-s">Save strip</button><button class="btn alt" id="pb-l">Change layout</button><button class="btn alt" id="pb-r">Retake photos</button></div><button class="btn alt" id="pb-x">Back to the party</button>`);
  $('pb-s').onclick=()=>saveStrip(c);$('pb-l').onclick=()=>pbLayout(n,shots);$('pb-r').onclick=()=>pbCam(n);$('pb-x').onclick=closeOv;
  confetti(innerWidth/2,innerHeight/3,50)}
async function saveStrip(c){
  const blob=await new Promise(r=>c.toBlob(r,'image/png')),name='our-photo-strip.png';
  try{const d=window.claude&&window.claude.use?await window.claude.use('downloads'):null;if(d){await d.save({filename:name,data:blob});return}}catch(e){if(e&&e.code==='declined')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function closeOv(){closeLetter();stopCam();bgm.play('main');stopMic();$('ov').classList.remove('on')}
function out(){
  stopMic();const w=$('cw');if(!w||w.classList.contains('out'))return;w.classList.add('out');
  [34.8,47.5,60.7,71.7].forEach((x,i)=>[0,350].forEach(d=>setTimeout(()=>{const s=document.createElement('i');s.className='sm';s.style.left=x+'%';s.style.top=(10+i%2*3)+'%';w.appendChild(s);setTimeout(()=>s.remove(),1900)},d+i*80)));
  $('blow').hidden=true;$('meter').hidden=true;$('cap').textContent=CFG.wishCaption;
  confetti(innerWidth/2,innerHeight/3,60);
  setBlown(true);readyGift();
}
function fallback(msg){$('cap').textContent=msg;$('blow').hidden=false;$('blow').disabled=false;$('blow').textContent="Tap to blow";$('blow').onclick=out;if($('cw'))$('cw').onclick=out}
async function startBlow(){
  const b=$('blow');if(b.disabled)return;b.disabled=true;$('cap').textContent="Allow the microphone, then blow on it.";
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}
  catch(e){fallback("The microphone isn't available here, so tap to blow instead.");return}
  bgm.hold(true);const ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();
  const an=ctx.createAnalyser();an.fftSize=1024;ctx.createMediaStreamSource(stream).connect(an);
  mic={stream,ctx};const buf=new Float32Array(an.fftSize);
  b.hidden=true;$('meter').hidden=false;const bar=$('meter').firstElementChild;
  let amb=0,n=0,held=0,last=performance.now();const t0=last;
  $('cap').textContent="Take a breath… then blow on the microphone.";
  (function loop(now){
    an.getFloatTimeDomainData(buf);let s=0;for(const v of buf)s+=v*v;const rms=Math.sqrt(s/buf.length),dt=now-last;last=now;
    if(now-t0<700){amb+=rms;n++}
    else{const base=amb/Math.max(n,1),thr=Math.max(base*2.5,base+0.08);
      bar.style.width=Math.min(100,Math.max(0,(rms-base)/(thr-base+0.15)*100))+'%';
      held=rms>thr?held+dt:Math.max(0,held-dt*2);
      if(held>=350){out();return}}
    raf=requestAnimationFrame(loop)})(last);
}
const im=k=>`<img src="${IMG[k]}" alt="">`;
const scenes={
  booth:()=>boothScene(),
  gift:()=>giftScene(),
  cake:()=>{bgm.play('cake');show(`<div class="zs" style="background-image:url(${IMG.zoombg})"><button class="zi cakewrap${blown?' out':''}" id="cw" aria-label="Cake"><img id="off" src="${IMG.cakeunlit}" alt=""><img id="lit" src="${IMG.caketrans}" alt="Cake"></button><button class="zi ${blown?'ready':'locked'}" id="zg" aria-label="Gift"><img src="${IMG.gifttrans}" alt=""></button></div><div id="meter" hidden><i></i></div><button class="btn" id="blow" ${blown?'hidden':''}>Blow out the candles</button>`,blown?CFG.wishCaption:CFG.cakeCaption,null);
    $('blow').onclick=startBlow;$('cw').onclick=()=>{if(!blown)startBlow()};$('zg').onclick=openGift;confetti(innerWidth/2,innerHeight/3,30)},
  shelf:()=>{bgm.play('shelf');
    const rows=[['r1','6.4%','27.4%','📖 View album'],['r2','37.7%','25.8%','🎬 Watch something together'],['r3','69.1%','23.6%','\u2190 Back to the party']];
    const cell=(r,i)=>{const s=`top:${r[1]};height:${r[2]}`,lab=`<span class="rl">${r[3]}</span>`;
      return i===1?`<a class="rowb" id="${r[0]}" style="${s}" href="${CFG.discordLink||'#'}" target="_blank" rel="noopener noreferrer">${lab}</a>`:`<button class="rowb" id="${r[0]}" style="${s}">${lab}</button>`};
    show(`<div class="gs big"><img src="${IMG.shelfscene}" alt="Our little shelf">${rows.map(cell).join('')}</div>`,"");
    $('ov').classList.add('menu');$('r1').onclick=scenes.album;$('r3').onclick=closeOv;
  },

  watch:()=>{const yt=CFG.youtubeLink;
    show(`<div class="menu-box"><h2>Movie night 🎬</h2><div class="steps">1. Open our Discord chat and start a call.<br>2. Tap the rocket (Activities) icon and pick <b>Watch Together</b>.<br>3. ${yt?'Paste our video link there.':'Search or paste any YouTube link.'}</div>${yt?'<button class="btn alt" id="w-copy">Copy video link</button>':''}${CFG.discordLink?`<a class="btn" href="${CFG.discordLink}" target="_blank" rel="noopener noreferrer">Open Discord</a>`:''}<button class="btn alt" id="w-back">Back</button></div>`,"");
    $('ov').classList.add('menu');$('w-back').onclick=scenes.shelf;
    if(yt)$('w-copy').onclick=async e=>{try{await navigator.clipboard.writeText(yt);e.target.textContent="Copied!"}catch(_){e.target.textContent=yt}}},
  album:()=>{const n=ALBUM.length;let i=0;
    show(`<div class="pstack" id="ps" tabindex="0" aria-label="Photo album. Tap to turn the page.">${ALBUM.map((a,k)=>`<img class="pg" src="${a.src}" alt="${a.alt}" style="--z:${n-k};--r:${k?(k%2?1:-1)*(1+k%3*.6):0}deg;--x:${k?(k%2?1:-1)*k*.4:0}%;--y:${k*.5}%;--d:${(n-1-k)*.1}s">`).join('')}</div><div class="pctl"><button class="btn alt" id="pv" aria-label="Previous page">\u25C0</button><span id="pn"></span><button class="btn alt" id="nx" aria-label="Next page">\u25B6</button></div>`,CFG.albumCaption,{label:"Back to the shelf",go:scenes.shelf});
    const pg=[...document.querySelectorAll('#ps .pg')];
    const upd=()=>{pg.forEach((p,k)=>p.classList.toggle('gone',k<i));$('pn').textContent=(i+1)+' / '+n};
    const next=()=>{i=i<n-1?i+1:0;upd()},prev=()=>{if(i>0){i--;upd()}};
    $('ps').onclick=next;$('nx').onclick=next;$('pv').onclick=prev;
    $('ps').onkeydown=e=>{if(e.key==='ArrowRight'||e.key===' '||e.key==='Enter'){e.preventDefault();next()}if(e.key==='ArrowLeft'){e.preventDefault();prev()}};
    upd();$('ps').focus({preventScroll:true})}
};
['booth','cake','shelf'].forEach(k=>$(k).onclick=scenes[k]);
['bl','br'].forEach(k=>$(k).onclick=e=>{const el=e.currentTarget,r=el.getBoundingClientRect(),st=$('stage');
  confetti(r.left+r.width/2,r.top+r.height/3,26);
  const m=document.createElement('div');m.className='msg';m.textContent=CFG.balloonMsg;
  m.style.left=(el.offsetLeft+el.offsetWidth/2)/st.offsetWidth*100+'%';m.style.top=(el.offsetTop+el.offsetHeight*.3)/st.offsetHeight*100+'%';
  st.appendChild(m);setTimeout(()=>{m.style.transition='opacity .4s';m.style.opacity='0';setTimeout(()=>m.remove(),450)},1100);el.classList.add('popped');el.style.pointerEvents='none';setTimeout(()=>el.style.visibility='hidden',250)});
applyCake();
if(innerWidth<innerHeight){const s=$('scroll');s.scrollLeft=(s.scrollWidth-s.clientWidth)/2}
</script></body></html>
